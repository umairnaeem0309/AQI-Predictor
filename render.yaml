# Render Blueprint — AQI Predictor
# Deploy FastAPI backend only
# Streamlit dashboard deploys to Streamlit Cloud

services:
  # FastAPI Backend
  - type: web
    name: aqi-predictor-api
    runtime: docker
    dockerfilePath: ./Dockerfile
    envVars:
      - key: MOCK_MODE
        value: "false"
      - key: API_KEY
        generateValue: true
      - key: LOG_LEVEL
        value: "info"
      - key: RATE_LIMIT_REQUESTS
        value: "1000"
      - key: RATE_LIMIT_ENABLED
        value: "true"
    healthCheckPath: /health
    autoDeploy: true

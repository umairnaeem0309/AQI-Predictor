name: Daily Model Training

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_register:
        description: 'Force model registration'
        required: false
        default: 'false'
        type: boolean
      min_improvement:
        description: 'Minimum MAE improvement to register (e.g., 0.01 = 1%)'
        required: false
        default: '0.01'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  train:
    name: Train All Models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train all models from Hopsworks
        id: train
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_register || 'false' }}" = "true" ]; then
            ARGS="--force-register"
          fi
          ARGS="$ARGS --min-improvement ${{ github.event.inputs.min_improvement || '0.01' }}"
          python scripts/train_model.py $ARGS
        env:
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT || vars.HOPSWORKS_PROJECT }}

      - name: Upload model artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: |
            models/production/
            models/metadata/
          retention-days: 90

      - name: Commit model update
        if: success() && github.event_name == 'schedule'
        run: |
          git config user.name "Umair Naeem"
          git config user.email "umairnaeem0309@gmail.com"
          git add models/production/best_model.pkl
          git add models/production/model_metadata.json
          git add models/metadata/best_metrics.json
          git diff --staged --quiet || git commit -m "chore: daily model retrain [skip ci]"
          git push

      - name: Report training results
        if: always()
        run: |
          echo '## Training Results' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          if [ -f models/production/model_metadata.json ]; then
            python scripts/report_training.py >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo 'Report script not found'
          else
            echo 'No model metadata available' >> $GITHUB_STEP_SUMMARY
          fi

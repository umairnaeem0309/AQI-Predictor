name: Daily Model Training

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_register:
        description: 'Force model registration'
        required: false
        default: 'false'
        type: boolean
      min_improvement:
        description: 'Minimum MAE improvement to register (e.g., 0.01 = 1%)'
        required: false
        default: '0.01'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  train:
    name: Train All Models
    runs-on: ubuntu-latest
    timeout-minutes: 60
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Train all models from Hopsworks
        id: train
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_register }}" = "true" ]; then
            ARGS="--force-register"
          fi
          ARGS="$ARGS --min-improvement ${{ github.event.inputs.min_improvement }}"
          python scripts/train_model.py $ARGS
        env:
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT }}

      - name: Upload model artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: |
            models/production/
            models/metadata/
          retention-days: 90

      - name: Commit model update
        if: success() && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/production/best_model.pkl
          git add models/production/model_metadata.json
          git add models/metadata/best_metrics.json
          git diff --staged --quiet || git commit -m "chore: daily model retrain [skip ci]"
          git push

      - name: Report training results
        if: always()
        run: |
          echo "## 🧠 Training Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "models/production/model_metadata.json" ]; then
            python -c "
import json
with open('models/production/model_metadata.json') as f:
    m = json.load(f)
print(f'**Best Model:** {m.get(\"model_name\", \"unknown\")}')
print(f'**Test MAE:** {m.get(\"metrics\", {}).get(\"test\", {}).get(\"mae\", 0):.2f}')
print(f'**Test R²:** {m.get(\"metrics\", {}).get(\"test\", {}).get(\"r2\", 0):.4f}')
print(f'**Data Source:** {m.get(\"data_source\", \"unknown\")}')
print(f'**Train Rows:** {m.get(\"train_rows\", 0):,}')
print(f'**Features:** {m.get(\"n_features\", 0)}')
" >> $GITHUB_STEP_SUMMARY
          else
            echo "No model metadata available" >> $GITHUB_STEP_SUMMARY
          fi

name: Daily Model Training

on:
  schedule:
    - cron: '0 6 * * *'  # Every day at 6 AM UTC
  workflow_dispatch:
    inputs:
      force_register:
        description: 'Force model registration'
        required: false
        default: 'false'
        type: boolean
      min_improvement:
        description: 'Minimum MAE improvement to register (e.g., 0.01 = 1%)'
        required: false
        default: '0.01'

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  train:
    name: Train Model
    runs-on: ubuntu-latest
    timeout-minutes: 30
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Download latest features
        uses: actions/download-artifact@v4
        with:
          name: feature-store-*
          path: data/processed/features/
        continue-on-error: true  # May not exist yet

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check feature store
        run: |
          if [ ! -f "data/processed/features/hourly_observations.parquet" ]; then
            echo "No features found. Run feature collection first."
            exit 1
          fi
          python -c "
          import pandas as pd
          df = pd.read_parquet('data/processed/features/hourly_observations.parquet')
          print(f'Total records: {len(df)}')
          print(f'Training valid: {df[\"is_training_valid\"].sum() if \"is_training_valid\" in df.columns else \"N/A\"}')
          print(f'Cities: {df[\"location_id\"].unique().tolist() if \"location_id\" in df.columns else \"N/A\"}')
          "

      - name: Train model
        run: |
          ARGS=""
          if [ "${{ github.event.inputs.force_register }}" = "true" ]; then
            ARGS="--force-register"
          fi
          ARGS="$ARGS --min-improvement ${{ github.event.inputs.min_improvement }}"
          python scripts/train_model.py $ARGS

      - name: Upload model artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: model-${{ github.run_number }}
          path: |
            models/production/
            models/metadata/
          retention-days: 90

      - name: Commit model update
        if: success() && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add models/production/xgboost_model.pkl
          git add models/production/model_metadata.json
          git add models/metadata/best_metrics.json
          git diff --staged --quiet || git commit -m "chore: daily model retrain [skip ci]"
          git push

      - name: Report training results
        if: always()
        run: |
          echo "## Training Results" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          if [ -f "models/metadata/best_metrics.json" ]; then
            python -c "
          import json
          with open('models/metadata/best_metrics.json') as f:
              m = json.load(f)
          print(f\"- **MAE:** {m.get('mae', 'N/A'):.2f}\")
          print(f\"- **RMSE:** {m.get('rmse', 'N/A'):.2f}\")
          print(f\"- **R²:** {m.get('r2', 'N/A'):.4f}\")
          print(f\"- **Date:** {m.get('date', 'N/A')}\")
          " >> $GITHUB_STEP_SUMMARY
          else
            echo "No model metrics available" >> $GITHUB_STEP_SUMMARY
          fi

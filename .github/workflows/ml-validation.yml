name: ML Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      validate_data:
        description: 'Validate data quality'
        required: false
        default: 'true'
      validate_model:
        description: 'Validate model artifacts'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  data-safety:
    name: Data Safety Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate no synthetic data in production
        run: |
          python -c "
          import json
          from pathlib import Path
          
          metadata_files = list(Path('data/processed').glob('*_metadata.json'))
          
          for mf in metadata_files:
              with open(mf) as f:
                  meta = json.load(f)
                  ds_type = meta.get('dataset_type', 'unknown')
                  approved = meta.get('approved_for_training', False)
                  
                  print(f'{mf.name}: type={ds_type}, approved={approved}')
                  
                  if ds_type == 'synthetic_test_data' and approved:
                      raise ValueError(f'Synthetic data approved for training: {mf}')
          
          print('Data safety check passed')
          "

  model-validation:
    name: Model Artifact Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate model registry state
        run: python scripts/validate_production.py

      - name: Check lifecycle transitions
        run: |
          python -c "
          try:
              from src.models.lifecycle import ModelState
              
              # Verify lifecycle definitions exist
              states = [s.value for s in ModelState]
              print(f'Lifecycle states: {states}')
              print('Lifecycle validation passed')
          except ImportError:
              print('Lifecycle module not available, skipping')
          except Exception as e:
              print(f'Warning: {e}')
          "

  feature-quality:
    name: Feature Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate feature pipeline
        run: |
          python -c "
          import pandas as pd
          import numpy as np
          from pathlib import Path
          
          # Check if training features exist
          train_path = Path('data/processed/train_features.csv')
          if train_path.exists():
              df = pd.read_csv(train_path, nrows=100)
              print(f'Training features: {len(df)} rows, {len(df.columns)} columns')
              
              # Check for required columns
              required = ['temperature', 'humidity', 'pm25', 'pm10', 'aqi']
              missing = [c for c in required if c not in df.columns]
              if missing:
                  print(f'Warning: Missing columns: {missing}')
              else:
                  print('All required columns present')
              
              # Check for NaN percentage
              nan_pct = df.isnull().mean().mean() * 100
              print(f'Average NaN percentage: {nan_pct:.1f}%')
              
              if nan_pct > 50:
                  raise ValueError(f'Too many NaN values: {nan_pct:.1f}%')
              
              print('Feature quality check passed')
          else:
              print('Training features not found, skipping quality check')
          "

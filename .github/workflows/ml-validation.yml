name: ML Validation

on:
  push:
    branches: [main]
  schedule:
    - cron: '0 6 * * 1'  # Weekly on Monday at 6 AM UTC
  workflow_dispatch:
    inputs:
      validate_data:
        description: 'Validate data quality'
        required: false
        default: 'true'
      validate_model:
        description: 'Validate model artifacts'
        required: false
        default: 'true'

permissions:
  contents: read

jobs:
  data-safety:
    name: Data Safety Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate no synthetic data in production
        run: |
          python -c "
          import json
          from pathlib import Path
          
          # Check all dataset metadata files
          metadata_files = list(Path('data/processed').glob('*_metadata.json'))
          
          for mf in metadata_files:
              with open(mf) as f:
                  meta = json.load(f)
                  ds_type = meta.get('dataset_type', 'unknown')
                  approved = meta.get('approved_for_training', False)
                  
                  print(f'{mf.name}: type={ds_type}, approved={approved}')
                  
                  # In production, synthetic data should not exist
                  # For now, just log the status
          
          print('Data safety check completed')
          "

      - name: Validate feature schema
        run: |
          python -c "
          from src.features.feature_engineering import FeatureEngineer
          from src.features.feature_validation import FeatureValidator
          
          print('Feature schema validation passed')
          "

  model-validation:
    name: Model Artifact Validation
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate model registry state
        run: |
          python scripts/validate_production.py

      - name: Check lifecycle transitions
        run: |
          python -c "
          from src.models.lifecycle import ModelStatus, validate_lifecycle_transition
          
          # Verify lifecycle definitions are valid
          valid_transitions = [
              (ModelStatus.UNTRAINED, ModelStatus.TRAINING),
              (ModelStatus.TRAINING, ModelStatus.EVALUATED),
              (ModelStatus.EVALUATED, ModelStatus.CANDIDATE),
              (ModelStatus.CANDIDATE, ModelStatus.APPROVED),
              (ModelStatus.APPROVED, ModelStatus.REGISTERED),
              (ModelStatus.REGISTERED, ModelStatus.PRODUCTION),
          ]
          
          for from_s, to_s in valid_transitions:
              assert validate_lifecycle_transition(from_s, to_s), f'Invalid: {from_s} -> {to_s}'
          
          print('Lifecycle transition validation passed')
          "

  feature-quality:
    name: Feature Quality Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Validate feature pipeline
        run: |
          python -c "
          from src.features.feature_engineering import FeatureEngineer
          from src.features.feature_validation import FeatureValidator
          import pandas as pd
          import numpy as np
          
          # Create sample data
          dates = pd.date_range('2026-06-01', periods=100, freq='h')
          sample = pd.DataFrame({
              'timestamp': dates,
              'location_id': 'test',
              'temperature': np.random.randn(100) * 10 + 30,
              'humidity': np.random.randn(100) * 5 + 60,
              'aqi': np.random.randint(0, 200, 100),
              'pm25': np.random.randn(100) * 20 + 50,
          })
          
          # Run feature engineering
          engineer = FeatureEngineer()
          features = engineer.create_features(sample)
          
          # Validate
          validator = FeatureValidator()
          is_valid, issues = validator.validate(features)
          
          print(f'Feature validation: {is_valid}')
          print(f'Issues found: {len(issues)}')
          "

name: Hourly Feature Collection

on:
  schedule:
    - cron: '0 * * * *'  # Every hour at :00
  workflow_dispatch:
    inputs:
      city:
        description: 'City to collect (karachi/lahore/islamabad or empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no persistence)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  collect:
    name: Collect Features
    runs-on: ubuntu-latest
    timeout-minutes: 15
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect features from Open-Meteo
        id: collect
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.city }}" ]; then
            ARGS="--city ${{ github.event.inputs.city }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/collect_features.py $ARGS
        env:
          HOPSWORKS_HOST: ${{ secrets.HOPSWORKS_HOST }}
          HOPSWORKS_API_KEY: ${{ secrets.HOPSWORKS_API_KEY }}
          HOPSWORKS_PROJECT: ${{ secrets.HOPSWORKS_PROJECT || vars.HOPSWORKS_PROJECT }}

      - name: Report results
        if: always()
        run: |
          echo '## Feature Collection Results' >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          echo "**Time:** $(date -u +'%Y-%m-%d %H:%M:%S UTC')" >> $GITHUB_STEP_SUMMARY
          echo '' >> $GITHUB_STEP_SUMMARY
          if [ -f data/collection_health.json ]; then
            python scripts/report_collection.py >> $GITHUB_STEP_SUMMARY 2>/dev/null || echo 'Report script not found'
          else
            echo 'No collection log available' >> $GITHUB_STEP_SUMMARY
          fi

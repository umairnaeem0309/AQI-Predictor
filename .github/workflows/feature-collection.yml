name: Hourly Feature Collection

on:
  schedule:
    - cron: '0 * * * *'  # Every hour
  workflow_dispatch:
    inputs:
      city:
        description: 'City to collect (karachi/lahore/islamabad or empty for all)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run (no persistence)'
        required: false
        default: 'false'
        type: boolean

permissions:
  contents: write

env:
  PYTHON_VERSION: '3.11'

jobs:
  collect:
    name: Collect Features
    runs-on: ubuntu-latest
    timeout-minutes: 10
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Collect features
        run: |
          ARGS=""
          if [ -n "${{ github.event.inputs.city }}" ]; then
            ARGS="--city ${{ github.event.inputs.city }}"
          fi
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          python scripts/collect_features.py $ARGS

      - name: Upload feature store
        if: success() && github.event.inputs.dry_run != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: feature-store-${{ github.run_number }}
          path: data/processed/features/
          retention-days: 30

      - name: Commit updated features
        if: success() && github.event.inputs.dry_run != 'true' && github.event_name == 'schedule'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/processed/features/hourly_observations.parquet
          git add data/processed/features/collection_metadata.json
          git diff --staged --quiet || git commit -m "chore: update hourly features [skip ci]"
          git push
